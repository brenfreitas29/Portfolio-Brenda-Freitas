name: Materialize VivaTrip image

on:
  push:
    paths:
      - '.github/workflows/materialize-vivatrip-image.yml'
      - 'public/projects/vivatrip-portfolio-data.txt'

permissions:
  contents: write

jobs:
  build-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image asset
        run: |
          base64 -d public/projects/vivatrip-portfolio-data.txt > public/projects/vivatrip-portfolio.jpg
          rm public/projects/vivatrip-portfolio-data.txt
          rm -f public/projects/vivatrip-portfolio.txt
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/vivatrip-portfolio.jpg public/projects/vivatrip-portfolio-data.txt public/projects/vivatrip-portfolio.txt
          git commit -m "Add VivaTrip screenshot to portfolio repository" || exit 0
          git push
